# Build Next.js static export and deploy docs/ to GitHub Pages (not the repo root).
# Rebuild from another repo (e.g. after a blvm release): repository_dispatch with
# event type "blvm-release" (requires a token with contents access to this repo).
name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  repository_dispatch:
    types: [blvm-release]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, builds]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Refresh install metadata from blvm GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-blvm-release.mjs --strict

      - name: Static export (Next.js → docs/)
        run: npm run export

      - name: Copy CNAME for custom domain
        run: |
          if [ -f CNAME ]; then cp CNAME docs/CNAME; fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: [self-hosted, Linux, X64, builds]

    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
